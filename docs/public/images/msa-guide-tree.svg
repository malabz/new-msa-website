<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="372" viewBox="0 0 560 372" role="img" aria-labelledby="title desc">
<title id="title">指导树中的渐进式合并顺序</title>
<desc id="desc">先合并S1与S3，再加入S2，最后加入S4。树的枝长只用于排版，不表示进化距离。</desc>
<style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#58666e" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="560" height="372" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="32" y="24" font-size="24" fill="#27343b" font-weight="600" text-anchor="start" dominant-baseline="middle">合并顺序</text>
<path d="M 306 64 L 306 136" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 306 64 L 408 64" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 306 136 L 408 136" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 208 100 L 306 100" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 208 100 L 208 232" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 208 232 L 408 232" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 112 166 L 208 166" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 112 166 L 112 332" fill="none" stroke="#58666e" stroke-width="1.8"/>
<path d="M 112 332 L 408 332" fill="none" stroke="#58666e" stroke-width="1.8"/>
<text x="430" y="64" font-size="30" fill="#27343b" font-weight="400" text-anchor="start" dominant-baseline="middle" class="mono">S1</text>
<text x="430" y="136" font-size="30" fill="#27343b" font-weight="400" text-anchor="start" dominant-baseline="middle" class="mono">S3</text>
<text x="430" y="232" font-size="30" fill="#27343b" font-weight="400" text-anchor="start" dominant-baseline="middle" class="mono">S2</text>
<text x="430" y="332" font-size="30" fill="#27343b" font-weight="400" text-anchor="start" dominant-baseline="middle" class="mono">S4</text>
<circle cx="306" cy="100" r="19" fill="#087f8c"/>
<text x="306" y="100" font-size="23" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle">1</text>
<circle cx="208" cy="166" r="19" fill="#087f8c"/>
<text x="208" y="166" font-size="23" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle">2</text>
<circle cx="112" cy="249" r="19" fill="#087f8c"/>
<text x="112" y="249" font-size="23" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle">3</text>
</svg>
