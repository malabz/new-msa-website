<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="684" viewBox="0 0 560 684" role="img" aria-labelledby="title desc">
<title id="title">同步空位并合并三条序列</title>
<desc id="desc">先保留S1与S2已有的比对，再同步补入S1的新末端空位，最后加入S3。结果为ACGT-、A-GT-、ACGTT。</desc>
